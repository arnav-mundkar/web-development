<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="tophead">Rock Paper Scissors</h1>
    <div class="icons">
        <div class="iconbutton">
            <img src="rock.png" alt="Rock" class="icon-image" id="Rock">
        </div>
        <div class="iconbutton">
            <img src="paper.png" alt="Paper" class="icon-image" id="Paper">
        </div>
        <div class="iconbutton">
            <img src="scissors.png" alt="Scissors" class="icon-image" id="Scissors">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>User</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-box">
        <p id="msg">Welcome to Rock-Paper-Scissors! Click on an icon to start the game!</p>
    </div>
    <button class="btn">Play Again</button>
    <script src="script.js"></script>
</body>
</html>
